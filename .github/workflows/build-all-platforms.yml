name: Build Cross-Platform Matrix

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target_name: macos
            build_cmd: npm run package:mac:universal
          - os: windows-latest
            target_name: windows
            build_cmd: npm run package:win
          - os: ubuntu-latest
            target_name: linux
            build_cmd: npm run package:linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install System Libraries (Ubuntu/Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Application Bundle
        run: ${{ matrix.build_cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mochi-companion-${{ matrix.target_name }}
          path: release/*.*
